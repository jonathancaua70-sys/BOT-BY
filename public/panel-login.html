<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css?v=3">
</head>
<body class="login-page theme-dark">
    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Alternar tema">
        <i class="fas fa-moon"></i>
        <span>Dark</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <p id="panelBadge" class="login-desc" style="margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem;"></p>
            <h1 id="panelTitle">Dashboard</h1>
            <p id="panelDesc" class="login-desc">Faça o login para acessar o painel</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="seu usuario" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="btn-submit">Entrar</button>
            </form>

            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <script>
    (function () {
        const API_URL = '/api';
        const PANEL_LABELS = {
            'external-advanced': { title: 'External Advanced', badge: 'Externo · Advanced' },
            'external-premium': { title: 'External Premium', badge: 'Externo · Premium' },
            'internal-advanced': { title: 'Internal Advanced', badge: 'Interno · Advanced' },
            'internal-premium': { title: 'Internal Premium', badge: 'Interno · Premium' },
        };

        const pathMatch = window.location.pathname.match(/\/login\/([a-z0-9-]+)/i);
        const panelId = pathMatch ? pathMatch[1] : null;

        if (!panelId || !PANEL_LABELS[panelId]) {
            document.getElementById('panelTitle').textContent = 'Painel inválido';
            document.getElementById('panelDesc').textContent = 'URL de login não reconhecida.';
            document.getElementById('loginForm').style.display = 'none';
            return;
        }

        const panelInfo = PANEL_LABELS[panelId];
        document.getElementById('panelTitle').textContent = panelInfo.title;
        document.getElementById('panelBadge').textContent = panelInfo.badge;
        document.title = 'Login - ' + panelInfo.title;

        let isDarkTheme = localStorage.getItem('theme') !== 'light';

        function applyTheme() {
            document.body.classList.toggle('theme-dark', isDarkTheme);
            document.body.classList.toggle('theme-light', !isDarkTheme);
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            btn.innerHTML = isDarkTheme
                ? '<i class="fas fa-moon"></i><span>Dark</span>'
                : '<i class="fas fa-sun"></i><span>Light</span>';
        }

        function showError(text) {
            const el = document.getElementById('errorMessage');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        async function getCSRFToken() {
            const response = await fetch(API_URL + '/csrf-token');
            const data = await response.json();
            return data.success ? data.csrfToken : null;
        }

        async function fetchAndSolveCaptcha() {
            try {
                const response = await fetch(API_URL + '/captcha');
                const data = await response.json();
                if (!data.success || !data.captchaId || !data.question) return null;
                const match = String(data.question).match(/(\d+)\s*([+\-])\s*(\d+)/);
                if (!match) return null;
                const a = parseInt(match[1], 10);
                const op = match[2];
                const b = parseInt(match[3], 10);
                return {
                    captchaId: data.captchaId,
                    captchaAnswer: op === '+' ? a + b : a - b
                };
            } catch (e) {
                return null;
            }
        }

        localStorage.removeItem('currentUser');
        localStorage.removeItem('loginTime');
        localStorage.removeItem('panelId');
        applyTheme();

        document.getElementById('themeToggle').addEventListener('click', function () {
            isDarkTheme = !isDarkTheme;
            localStorage.setItem('theme', isDarkTheme ? 'dark' : 'light');
            applyTheme();
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            try {
                const token = await getCSRFToken();
                if (!token) {
                    showError('Erro ao obter token de segurança. Tente novamente.');
                    return;
                }

                const captcha = await fetchAndSolveCaptcha();
                const body = { username, password };
                if (captcha) {
                    body.captchaId = captcha.captchaId;
                    body.captchaAnswer = captcha.captchaAnswer;
                }

                const response = await fetch(API_URL + '/login/' + panelId, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': token
                    },
                    body: JSON.stringify(body)
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    localStorage.setItem('loginTime', new Date().toISOString());
                    localStorage.setItem('panelId', panelId);
                    window.location.href = '/dashboard.html';
                } else {
                    showError(data.message || 'Usuário ou senha incorretos.');
                }
            } catch (err) {
                showError('Erro ao conectar com o servidor. Tente novamente.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            }
        });
    })();
    </script>
</body>
</html>
