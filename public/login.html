<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page theme-dark">
    <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Alternar tema">
        <i class="fas fa-moon"></i>
        <span>Dark</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <h1>Dashboard Hook Bypass</h1>
            <p class="login-desc">Faça o login para acessar a dashboard</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="seu usuario" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="btn-submit">Entrar</button>
            </form>

            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
